<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="860" height="200" rx="12" fill="url(#bg-grad)" />
  <rect width="860" height="200" rx="12" fill="url(#grid)" />
  <rect x="0.5" y="0.5" width="859" height="199" rx="11.5" stroke="#1E293B" stroke-opacity="0.8" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="50" r="160" fill="url(#glow-grad)" filter="blur(30px)" />

  <!-- Top Terminal Status Bar -->
  <g transform="translate(32, 28)">
    <circle cx="0" cy="0" r="4" fill="#EF4444" opacity="0.8" />
    <circle cx="12" cy="0" r="4" fill="#F59E0B" opacity="0.8" />
    <circle cx="24" cy="0" r="4" fill="#10B981" opacity="0.8" />
    <text x="44" y="3.5" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="1.5">TERMINAL // ETHAN.DEV // ENV: PRODUCTION</text>
    <text x="796" y="3.5" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="600">● AVAILABLE</text>
  </g>

  <!-- Main Title -->
  <text x="32" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    Ethan <tspan fill="url(#text-grad)">.</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="32" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    Full-Stack Engineer · System Builder · Exploring AI Agents, Mobile &amp; Distributed Tools
  </text>

  <!-- Command Line Execution Quote -->
  <g transform="translate(32, 162)">
    <rect x="0" y="-14" width="796" height="28" rx="6" fill="#030712" fill-opacity="0.6" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="4" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="600">$</text>
    <text x="30" y="4" fill="#CBD5E1" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="12">system.craft(clean_code, useful_tools) → <tspan fill="#34D399" font-weight="600">ship_with_pride()</tspan></text>
  </g>
</svg>
